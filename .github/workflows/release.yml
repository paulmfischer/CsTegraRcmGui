name: Release

# Push a tag matching v* (e.g. v1.2.0) to build self-contained Windows and
# Linux zips and publish them as a GitHub Release. Version is derived from
# the tag, not hardcoded anywhere in the source.
#
# macOS isn't built here yet — it needs to be tested locally first. Once
# that happens, add an osx-x64 / osx-arm64 leg to the matrix below the same
# way as the existing two.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Derive version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Publish
        shell: bash
        run: |
          dotnet publish src/CsTegraRcmGui/CsTegraRcmGui.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:Version=$VERSION \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=none \
            -o publish/${{ matrix.rid }}

      - name: Add prereq README and licensing docs
        shell: bash
        run: |
          cp LICENSE THIRD-PARTY-NOTICES.md publish/${{ matrix.rid }}/
          cp packaging/${{ runner.os == 'Windows' && 'windows' || 'linux' }}/README.md publish/${{ matrix.rid }}/README.md

      - name: Add udev rule (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p publish/${{ matrix.rid }}/udev
          cp packaging/linux/udev/99-cstegrarcmgui.rules publish/${{ matrix.rid }}/udev/

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath CsTegraRcmGui-$env:VERSION-${{ matrix.rid }}.zip

      - name: Zip (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: (cd publish/${{ matrix.rid }} && zip -r "../../CsTegraRcmGui-$VERSION-${{ matrix.rid }}.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: zip-${{ matrix.rid }}
          path: CsTegraRcmGui-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: zip-*
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
